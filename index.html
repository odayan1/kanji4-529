<body>
<div class="wrap" id="app"></div>
<script src="items.js"></script>
<script src="extra.js"></script>
<script src="dict.js"></script>
<script src="kotoba.js"></script>
<script src="notes.js"></script>
<script src="notes2.js"></script>
<script src="strokes.js"></script>
<script src="judge.js"></script>
<script>
(() => {
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isKanji = c => /\p{Script=Han}/u.test(c);

// ---- データ ----
const ITEMS = [];
for (const u of UNITS) u.items.forEach((s, i) => {
  const [pre, k, oku, post, yomi, src] = s.split("|");
  const it = { id: u.id + "-" + i, unit: u.id, pre, k, oku, post, yomi, src };
  it.weak = [...k].some(c => WEAK.includes(c));
  ITEMS.push(it);
});
const byUnit = id => ITEMS.filter(x => x.unit === id);
// テスト・じてん用：練習の問題＋ドリル「おぼえる」ページの例文
const POOL = ITEMS.slice();
for (const uid in EXTRA) EXTRA[uid].forEach((s, i) => {
  const [pre, k, oku, post, yomi, src] = s.split("|");
  POOL.push({ id: "x" + uid + "-" + i, unit: uid, pre, k, oku, post, yomi, src, weak: [...k].some(c => WEAK.includes(c)) });
});
// ---- ことばの意味（国語じてん） ----
const POOL_BY = Object.fromEntries(POOL.map(x => [x.id, x]));
const KW = KOTOBA.map(([w, y, m, ex]) => ({ w, y, m, ex: !!ex }));
function meaningsFor(it) {
  const sen = it.pre + it.k + it.oku + it.post, t = it.k + it.oku;
  const main = KW.filter(e => !e.ex && (e.w === t || (e.w.length > t.length && e.w.includes(it.k) && sen.includes(e.w))));
  main.sort((a, b) => (a.w === t ? -1 : 0) - (b.w === t ? -1 : 0));
  return main.concat(KW.filter(e => e.ex && sen.includes(e.w)));
}
// ことば → ドリルの単元（じてんの並び用）
const KW_UNIT = {};
for (const it of POOL) for (const e of meaningsFor(it)) if (!KW_UNIT[e.w]) KW_UNIT[e.w] = it.unit;
for (const e of KW) if (!KW_UNIT[e.w]) { const du = DICT_UNITS.find(([, cs]) => [...e.w].some(c => cs.includes(c))); KW_UNIT[e.w] = du ? du[0] : "u7"; }
const meanBtn = it => `<button class="mbtn" data-mean="${esc(it.id)}">📘 ことばの 意味</button>`;
function openSheet(html) {
  const bg = document.createElement("div"); bg.className = "shbg";
  bg.innerHTML = `<div class="sh">${html}<button class="btn big g" data-close>とじる</button></div>`;
  bg.onclick = e => { if (e.target === bg || e.target.closest("[data-close]")) bg.remove(); };
  document.body.appendChild(bg);
}
const kwHTML = e => `<div class="kwe"><div><span class="mw">${esc(e.w)}</span> <span class="my">${esc(e.y)}</span>${e.ex ? ` <span class="tagx">文の中の ことば</span>` : ""}</div><div class="mm">${esc(e.m)}</div></div>`;
function openMean(it) {
  const es = meaningsFor(it);
  openSheet(`<div class="sht">📘 ことばの 意味</div>
    <div class="sent" style="font-size:20px;margin:4px 0 8px">${esc(it.pre)}<u>${esc(it.k)}</u>${esc(it.oku)}${esc(it.post)}</div>
    ${es.map(kwHTML).join("") || `<div class="sub">このことばの 説明は まだ ありません。</div>`}`);
}

function buildTest() {
  for (let t = 0; t < 400; t++) {
    const cand = shuffle(POOL.slice()), used = new Set(), pick = [];
    for (const it of cand) {
      const ks = testKeys(it);
      if (!ks.length || ks.some(k => used.has(k))) continue;
      ks.forEach(k => used.add(k)); pick.push(it);
      if (pick.length === 50) break;
    }
    if (pick.length === 50) { shuffle(pick); return { r: pick.slice(0, 10), w: pick.slice(10) }; }
  }
  return null;
}

// はなまる（うずまき＋花びら）の線
function hanamaruPath(petals) {
  const c = 120, pts = [];
  if (!petals) { // まる：赤ペンの ◯（少し かさねて 1周ちょっと）
    for (let t = -1.9; t <= 2 * Math.PI - 1.5; t += 0.03) { const r = 92 + 6 * Math.sin(t * 1.3); pts.push([c + r * Math.cos(t), c + r * 0.93 * Math.sin(t)]); }
    return "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
  }
  for (let t = 0; t <= 6 * Math.PI; t += 0.06) { const r = 4 + t * 3.9; pts.push([c + r * Math.cos(t), c + r * Math.sin(t)]); }
  if (petals) for (let t = 0; t <= 2 * Math.PI + 0.01; t += 0.02) { const r = 78 + 30 * Math.abs(Math.sin(3.5 * t)); pts.push([c + r * Math.cos(t), c + r * Math.sin(t)]); }
  return "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
}
// 紙ふぶき
function confetti(n) {
  const cols = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#facc15"];
  const box = document.createElement("div"); box.className = "cfbox"; document.body.appendChild(box);
  for (let i = 0; i < n; i++) {
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "vw"; s.style.background = cols[i % cols.length];
    s.style.animationDuration = (2.2 + Math.random() * 2) + "s"; s.style.animationDelay = (Math.random() * 0.8) + "s";
    s.style.width = (6 + Math.random() * 6) + "px"; s.style.height = (8 + Math.random() * 8) + "px";
    s.style.setProperty("--dx", (Math.random() * 120 - 60) + "px"); s.style.setProperty("--rot", (Math.random() * 900 - 450) + "deg");
    box.appendChild(s);
  }
  setTimeout(() => box.remove(), 5500);
}

function setupPad() {
  const cv = document.getElementById("pad");

  cv.addEventListener("pointerdown", e => { if (W.done) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); pad.cur = [toXY(e)]; drawPad(); });

  });
  const end = () => { if (!pad.cur) return; W.slots[W.sel].strokes.push(pad.cur); pad.cur = null; tgRefresh(); };

}
function drawPad() {

  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }  // 幅と高さの 両方を 見る（幅だけだと 300×150 のまま のびる 画面がある）
  const ctx = pad.ctx, k = cv.width / 109;

  const all = W.slots[W.sel].strokes.concat(pad.cur ? [pad.cur] : []);
  ctx.strokeStyle = "#1f1f1f"; ctx.fillStyle = "#1f1f1f"; ctx.lineWidth = PEN; ctx.lineCap = "round"; ctx.lineJoin = "round";

    ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]); s.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.stroke();
  });
}

  document.getElementById("dk").classList.add("hidden");
  W.done = true; tgRefresh();
  const uniq = [...new Set([...it.k].filter(isKanji))];
  let h = results ? tgJudgeHTML(results)
    : `<div class="card"><div style="font-weight:800">お手本の 書き順</div><div class="jrow">${W.slots.map((s, k) => `<div><div class="lbl">${W.slots.length > 1 ? `${k + 1}字目「${esc(s.c)}」` : `「${esc(s.c)}」`}</div><svg viewBox="0 0 109 109" id="jv${k}"></svg><button class="btn g" style="width:100%;margin-top:6px;font-size:13px;padding:7px" data-replay="${k}">▶ もう一回 見る</button></div>`).join("")}</div>
      <button class="btn" id="rewrite" style="width:100%;margin-top:10px">✏️ 見ながら 書いてみる</button></div>`;
  h += `<div class="card"><div class="answer"><div class="lbl">こたえ</div>
    <div class="k">${[...it.k].map(c => isKanji(c) ? esc(c) : `<span class="ok2">${esc(c)}</span>`).join("")}<span class="ok2">${esc(it.oku)}</span></div>
    <div class="sent" style="font-size:20px;margin:0">${esc(it.pre)}<u>${esc(it.k)}</u>${esc(it.oku)}${esc(it.post)}</div>${meanBtn(it)}</div>`;
  if (WORD_NOTES[it.k]) h += `<div class="wn">💡 ${esc(WORD_NOTES[it.k])}</div>`;
  if (it.oku) h += `<div class="wn">💡 送りがなは「${esc(it.oku)}」。ノートに 書くときは 送りがなまで 書こう</div>`;
  h += `<div style="font-weight:800;margin-top:10px">ここに 気をつけて！（×に ならないために）</div>`;
  h += kanjiCardsHTML(uniq);
  h += `<div style="font-weight:800;margin-top:12px">自分で 丸つけ しよう</div>
    <div class="grade"><button class="g-o" data-g="o"><b>○</b>ばっちり</button><button class="g-s" data-g="s"><b>△</b>形が<br>あやしい</button><button class="g-x" data-g="x"><b>×</b>書けな<br>かった</button></div></div>`;
  const rev = document.getElementById("rev");
  rev.innerHTML = h;
  bindKanjiCards(rev, uniq);
  W.slots.forEach((s, k) => playRef(k, results ? results[k] : null));
  rev.querySelectorAll("[data-replay]").forEach(b => b.onclick = () => { const k = +b.dataset.replay; playRef(k, results ? results[k] : null); });
  document.getElementById("rewrite").onclick = () => {
    // 判定のあと＝消して書きなおす（下は消す）／わからない のあと＝お手本・答えを 残したまま 見ながら書く
    W.slots.forEach(s => s.strokes = []); W.done = false; W.sel = 0; if (results) rev.innerHTML = "";
    document.getElementById("go").classList.remove("hidden"); document.getElementById("dk").classList.remove("hidden");
    tgRefresh(); document.getElementById("qcard").scrollIntoView({ behavior: "smooth", block: "start" });
  };
  rev.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { const g = b.dataset.g; record(it, g, g === "o"); next(); });
  rev.scrollIntoView({ behavior: "smooth", block: "start" });
}
function playRef(k, r) {
  const st = STROKES[W.slots[k].c] || [], svg = document.getElementById("jv" + k);
  if (!svg) return;
  const hl = r && r.count.ok ? r.order.bad.map(b => b.i) : [];
  (jtimers[k] || []).forEach(clearTimeout); jtimers[k] = [];
  svg.innerHTML = GRID + st.map(d => `<path d="${d}" fill="none" stroke="#eee6da" stroke-width="3.4" stroke-linecap="round"/>`).join("")
    + st.map((d, i) => `<path class="an" d="${d}" fill="none" stroke="${hl.includes(i) ? "#e02424" : "#333"}" stroke-width="${hl.includes(i) ? 4.2 : 3.4}" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"/>`).join("");
  let t = 0;
  [...svg.querySelectorAll("path.an")].forEach((p, i) => {
    const L = p.getTotalLength(), dur = Math.max(300, L * 8);
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    jtimers[k].push(setTimeout(() => {
      p.style.opacity = 1; p.style.transition = `stroke-dashoffset ${dur}ms linear`;
      requestAnimationFrame(() => { p.style.strokeDashoffset = 0; });
      const [x, y] = startPt(st[i]);
      svg.insertAdjacentHTML("beforeend", `<text x="${Math.max(3, x - 5)}" y="${Math.max(8, y - 2)}" font-size="8" font-family="sans-serif" font-weight="700" fill="${hl.includes(i) ? "#d62020" : "#9a8a76"}">${i + 1}</text>`);
    }, t));
    t += dur + 200;
  });
}

// ---- 字ごとのカード（画数・注意・書き順）：練習・テスト・じてんで使う ----
function kanjiCardsHTML(chars, opt) {
  opt = opt || {};
  return chars.map((c, ci) => {
    const N = NOTES[c], st = STROKES[c] || [];
    let h = `<div class="kc">${opt.noHead ? "" : `<div class="hd"><div class="gl">${esc(c)}</div><div class="meta"><b>${st.length}画</b>${WEAK.includes(c) ? ` <span class="wk">⚠️ 要注意の字</span>` : ""}${NEW_KANJI.includes(c) ? "" : ` <span class="sub">（3年までに ならった字）</span>`}<br>${N ? "★をタップすると その画が 赤くなるよ" : ""}</div></div>`}
      <div class="sv"><svg viewBox="0 0 109 109" id="sv${ci}"></svg><div class="ctl">
      <button class="btn g" data-play="${ci}">▶ 書き順を見る</button>
      <button class="btn g" data-all="${ci}">ぜんぶ表示</button></div></div>`;
    if (N) h += `<ul class="pt">${N.p.map((p, pi) => `<li class="${p.s.length ? "tap" : ""}" data-c="${ci}" data-p="${pi}"><div>${esc(p.t)}${p.s.length ? ` <span class="s">（${p.s.join("・")}画目）</span>` : ""}</div></li>`).join("")}</ul>`;
    else h += `<div class="nonote">前の学年までに ならった字。形を 見て たしかめよう。</div>`;
    return h + `</div>`;
  }).join("");
}
function bindKanjiCards(root, chars) {
  chars.forEach((c, ci) => drawStatic(ci, c, []));
  root.querySelectorAll("[data-play]").forEach(b => b.onclick = () => { const ci = +b.dataset.play; const c = chars[ci]; animate(ci, c, NOTES[c] ? NOTES[c].p.flatMap(p => p.s) : []); });
  root.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { const ci = +b.dataset.all; root.querySelectorAll(`li[data-c="${ci}"]`).forEach(x => x.classList.remove("sel")); drawStatic(ci, chars[ci], []); });
  root.querySelectorAll("li.tap").forEach(li => li.onclick = () => {
    const ci = +li.dataset.c, c = chars[ci];
    root.querySelectorAll(`li[data-c="${ci}"]`).forEach(x => x.classList.toggle("sel", x === li));
    drawStatic(ci, c, NOTES[c].p[+li.dataset.p].s, true);
  });
}

// ---- 書き順の描画 ----
const GRID = `<rect x="1" y="1" width="107" height="107" fill="none" stroke="#e3c9a8" stroke-width="1"/><line x1="54.5" y1="1" x2="54.5" y2="108" stroke="#efdcc4" stroke-dasharray="3 3"/><line x1="1" y1="54.5" x2="108" y2="54.5" stroke="#efdcc4" stroke-dasharray="3 3"/>`;
function startPt(d) { const m = d.match(/M\s*([\d.]+)[ ,]([\d.]+)/); return m ? [+m[1], +m[2]] : [0, 0]; }
function numLabels(st, hl) {
  return st.map((d, i) => { const [x, y] = startPt(d); return `<text x="${Math.max(3, x - 5)}" y="${Math.max(8, y - 2)}" font-size="8" font-family="sans-serif" fill="${hl.includes(i + 1) ? "#d62020" : "#9a8a76"}" font-weight="700">${i + 1}</text>`; }).join("");
}
function drawStatic(ci, c, hl, only) {
  const st = STROKES[c] || [], svg = document.getElementById("sv" + ci);
  if (!svg) return;
  svg.innerHTML = GRID + st.map((d, i) => `<path d="${d}" fill="none" stroke="${hl.includes(i + 1) ? "#e02424" : (only ? "#b9b2a8" : "#333")}" stroke-width="${hl.includes(i + 1) ? 4.2 : 3.4}" stroke-linecap="round" stroke-linejoin="round"/>`).join("") + numLabels(st, hl);
}
const timers = {};
function animate(ci, c, hl) {
  const st = STROKES[c] || [], svg = document.getElementById("sv" + ci);
  (timers[ci] || []).forEach(clearTimeout); timers[ci] = [];
  svg.innerHTML = GRID + st.map(d => `<path d="${d}" fill="none" stroke="#eee6da" stroke-width="3.4" stroke-linecap="round"/>`).join("")
    + st.map((d, i) => `<path class="an" d="${d}" fill="none" stroke="${hl.includes(i + 1) ? "#e02424" : "#333"}" stroke-width="${hl.includes(i + 1) ? 4.2 : 3.4}" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"/>`).join("");
  const paths = [...svg.querySelectorAll("path.an")];
  let t = 0;
  paths.forEach((p, i) => {
    const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    const dur = Math.max(350, L * 9);
    timers[ci].push(setTimeout(() => {
      p.style.opacity = 1;
      p.style.transition = `stroke-dashoffset ${dur}ms linear`;
      requestAnimationFrame(() => { p.style.strokeDashoffset = 0; });
      const [x, y] = startPt(st[i]);
      svg.insertAdjacentHTML("beforeend", `<text x="${Math.max(3, x - 5)}" y="${Math.max(8, y - 2)}" font-size="8" font-family="sans-serif" fill="${hl.includes(i + 1) ? "#d62020" : "#9a8a76"}" font-weight="700">${i + 1}</text>`);
    }, t));
    t += dur + 220;
  });
}

// ---- 結果 ----
function result() {
  QLOG.done(logRec());
  const pct = Math.round(S.ok / S.firstTotal * 100);
  const msg = pct === 100 ? "パーフェクト！🎉" : pct >= 80 ? "よくできました！" : pct >= 50 ? "あと少し！" : "まちがえた所を もう一回 やろう";
  const nextTip = S.mode === "r" && pct === 100 && S.target !== "miss" && S.target !== "weak" ? `<div class="tip" style="margin-top:10px">読みが ぜんぶ ○！ つぎは <b>書き</b> に チャレンジしよう ✏️</div>` : "";
  const uniqMiss = [...new Map(S.miss.map(x => [x.id, x])).values()];
  $app.innerHTML = `<div class="card center"><div class="sub">${esc(S.title)}（${S.mode === "w" ? "書き" : "読み"}）</div>
    <div class="score">${S.ok} / ${S.firstTotal}</div><div style="font-size:20px;font-weight:800">${msg}</div>${nextTip}
    ${uniqMiss.length ? `<div style="font-weight:800;margin-top:14px;text-align:left">まちがえた（${S.mode === "w" ? "△×" : "×"}）問題</div><ul class="mlist">${uniqMiss.map(x => `<li data-mean="${esc(x.id)}"><i class="mi">📘</i>${esc(x.k)}${esc(x.oku)}<span>${esc(x.yomi + x.oku)}</span></li>`).join("")}</ul>` : ""}
    <div class="row2" style="margin-top:12px">
      ${uniqMiss.length ? `<button class="btn ${S.mode === "w" ? "" : "y"}" id="again">まちがえたのを<br>もう一回</button>` : ""}
      ${S.mode === "r" && S.target !== "miss" && S.target !== "weak" ? `<button class="btn" id="toW">書きへ すすむ</button>` : ""}
      <button class="btn g" id="home">ホームへ</button></div></div>`;
  document.getElementById("home").onclick = home;
  const a = document.getElementById("again");
  if (a) a.onclick = () => { const mode = S.mode; const list = uniqMiss; S = { mode, target: "miss", title: "まちがえた問題", q: list.map(it => ({ it })), i: 0, ok: 0, answered: 0, firstTotal: list.length, miss: [], t0: Date.now() }; mode === "w" ? prep() : show(); };
  const tw = document.getElementById("toW");
  if (tw) tw.onclick = () => start("w", S.target);
}

QLOG.open();
home();
})();
</script>
